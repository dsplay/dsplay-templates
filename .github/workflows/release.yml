name: Release libraries

# Publishes the libraries in packages/ to npm through Trusted Publishing (no token): each package must list
# this repo + workflow under Settings > Trusted Publisher on npmjs.com, with "npm publish" allowed.
# With pending changesets it opens/updates a "Version Packages" PR; merging that PR publishes.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: publishing authenticates through npm Trusted Publishing (OIDC, see id-token above).
