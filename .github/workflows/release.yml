name: Release libraries

# Publishes the libraries in packages/ to npm through Trusted Publishing (no token): each package must list
# this repo + workflow under Settings > Trusted Publisher on npmjs.com, with "npm publish" allowed.
# With pending changesets it opens/updates a "Version Packages" PR; merging that PR publishes.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          # No npm token: publishing authenticates through npm Trusted Publishing (OIDC, see id-token above).
      # changesets/action v2 pushes the release tags itself (through the GitHub API); this is only a fallback in case
      # it could not (a no-op when nothing was published or the tags are already on the remote).
      - name: Push release tags
        run: git push origin --tags
