name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The boilerplate ships without a lockfile (it lives in a workspace). Once you have committed your own
      # package-lock.json, switch to `npm ci` and add `cache: npm` to setup-node for reproducible, cached installs.
      - run: npm install
      - run: npm run linter
      - run: npm test
